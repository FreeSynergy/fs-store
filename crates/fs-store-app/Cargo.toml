[package]
name = "fs-store-app"
description = "FreeSynergy.Store, first window: sources, available and installed packages, progress of the running job; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.89"

[dependencies]
fs-store-core = { path = "../fs-store-core" }
fs-store-catalog = { path = "../fs-store-catalog" }
fs-store-engine = { path = "../fs-store-engine" }
fs-store-pgp = { path = "../fs-store-pgp" }
fs-store-sources = { path = "../fs-store-sources" }
fs-components = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.8" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.8" }
fs-components-primitives = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.8" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.18", features = ["rpc"] }
