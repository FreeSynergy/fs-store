[package]
name = "fs-store-tuf-publish"
description = "FreeSynergy.Store: signs and writes TUF metadata (targets, snapshot, timestamp) for a catalog, through tough's editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.89"

[[bin]]
name = "fs-store-tuf-publish"
path = "src/main.rs"

[dependencies]
tough = { version = "0.24", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "fs"] }
aws-lc-rs = "1"
jiff = "0.2"
serde_json = "1"

[dev-dependencies]
fs-store-tuf = { path = "../fs-store-tuf" }
tempfile = "3"
