[package]
name = "fs-store-server"
description = "Cap'n Proto server of FreeSynergy.Store: the contract store.capnp over a Unix socket, so programs ask the store whether an update exists for them"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_store_server"

[dependencies]
fs-store-core = { path = "../fs-store-core" }
fs-store-catalog = { path = "../fs-store-catalog" }
fs-store-engine = { path = "../fs-store-engine" }
fs-store-pgp = { path = "../fs-store-pgp" }
fs-store-sources = { path = "../fs-store-sources" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.17", features = ["rpc"] }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
