[package]
name = "fs-store-sources"
description = "File-backed list of launcher sources (TOML) behind SourceRepository"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-store-core = { path = "../fs-store-core" }
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde", "std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
