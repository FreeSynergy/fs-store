name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write   # the optional container job needs it even when skipped
jobs:
  release:
    uses: FreeSynergy/fs-release/.github/workflows/release.yml@main
    with:
      binaries: fs-store,fs-store-app
      name: fs-store
      kind: app
      app-id: net.freesynergy.Store
      windows-targets: ""   # the engine uses Unix symlinks and /proc; Windows comes with its own strategy
      app-name: FreeSynergy.Store
      description: "Install, update and extend FreeSynergy programs"
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
