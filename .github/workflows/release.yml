name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write   # the optional container job needs it even when skipped
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    uses: FreeSynergy/fs-release/.github/workflows/release.yml@main
    with:
      binaries: fs-store
      cargo-package: fs-store
      ignore-binaries: "fs-store-tuf-publish"   # the TUF publisher is for fs-catalog CI, not for people
      name: fs-store
      kind: app
      app-id: net.freesynergy.Store
      macos: false
      linux-formats: "tar.gz,rpm,deb"   # what the store installs (rpm on Fedora, deb on Debian/Ubuntu); AppImage and Arch only slow the build down
      windows-targets: ""   # Unsupported, on purpose: the engine uses Unix symlinks, /proc and Unix file modes, so there is no Windows build (no zip, no exe) until the engine has a Windows strategy
      app-name: FreeSynergy.Store
      description: "Install, update and extend FreeSynergy programs"
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
