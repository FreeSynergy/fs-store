# Copy to <repo>/.github/workflows/check.yml - runs fmt, clippy (pedantic), tests and the coding rules on every push.
name: check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: FreeSynergy/fs-release/.github/workflows/check.yml@v0.0.4
    with:
      # Software Vulkan (lavapipe): tests/window_draws.rs draws the shell into a picture; a runner has no GPU
      software-gpu: true
