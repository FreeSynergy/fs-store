# The gate of check.yml on the Windows runner of fs-release (windows-2022): fmt, clippy (pedantic), tests, coding rules.
# The Windows parts of fs-store-platform are built and tested here, never cross-built (ADR 0043, port decision of the sprint).
# Own steps instead of the reusable workflow, only because the tests run with `--no-fail-fast`: one failing test file must
# not hide the results of the others.
name: windows
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FreeSynergy/fs-release/actions/setup-rust@main
        with:
          components: rustfmt,clippy
          cache-key: windows
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic
      - run: cargo test --workspace --all-features --no-fail-fast
      - uses: FreeSynergy/fs-release/actions/rust-rules@main
      # The real installation on the runner: a setup.exe built the way fs-release builds it (same NSIS script) is installed
      # through the `Exe` strategy, read from the registry and removed through its uninstaller.
      - name: Build a probe setup (NSIS, the script of fs-release)
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory probe-stage | Out-Null
          Set-Content probe-stage\probe.txt hi
          Invoke-WebRequest https://raw.githubusercontent.com/FreeSynergy/fs-release/main/actions/package-windows/installer.nsi -OutFile installer.nsi
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 /DNAME=FreeSynergy.Probe /DVERSION=1.2.3 "/DSTAGE=$PWD\probe-stage" "/DOUT=$PWD\probe-setup.exe" installer.nsi
          "FS_PROBE_SETUP=$PWD\probe-setup.exe" >> $env:GITHUB_ENV
      - run: cargo test -p fs-store-engine --test windows_setup -- --nocapture
