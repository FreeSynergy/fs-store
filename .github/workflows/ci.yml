name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Format + Clippy + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout fs-desktop vendor (dioxus-desktop path dep)
        run: |
          git clone --no-checkout --depth=1 --filter=blob:none \
            https://github.com/FreeSynergy/fs-desktop.git \
            $GITHUB_WORKSPACE/../fs-desktop
          cd $GITHUB_WORKSPACE/../fs-desktop
          git sparse-checkout init
          git sparse-checkout set vendor/dioxus-desktop
          git checkout

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -p fs-store -p fs-store-app -p fs-store-cli -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all
